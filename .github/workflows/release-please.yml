name: release-please

# release-please owns versioning: it keeps a release PR up to date with the
# version bumps and CHANGELOG entries implied by the conventional commits on
# `master`. Merging that PR creates the git tags and GitHub Releases.
on:
  push:
    branches:
      - master
  # Manual retry for failed publishes: `publish-unpublished.js` is idempotent,
  # so it only publishes versions missing from the registry.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
  # Publishes whatever the release commit left missing from the registry.
  publish:
    needs: release-please
    if:
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created ==
      'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # `check-latest` also picks up an npm new enough for trusted publishing
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: yarn
          check-latest: true
          registry-url: "https://registry.npmjs.org"
      # `prebootstrap` runs a plain `yarn`, which would quietly update the lockfile.
      # Install up front so a drifted lockfile fails the job instead.
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # `prebootstrap` builds gatsby-core-utils, `bootstrap` builds the other 104
      - name: Build packages
        run: yarn bootstrap
      # ~105 packages, so one idempotent script rather than a step per package.
      # Authentication is npm trusted publishing - each package on npmjs.com
      # names this repository *and this workflow's filename* as its trusted
      # publisher, so renaming this file invalidates those configs.
      - name: Publish packages
        run: node scripts/publish-unpublished.js
